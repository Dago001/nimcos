# NIMCOS E-VOTING — Nginx site configuration (Ubuntu 24.04, PHP-FPM 8.3+)
# Replace vote.nimcos.example.ng with the real host name.

limit_req_zone $binary_remote_addr zone=nimcos_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nimcos_auth:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name vote.nimcos.example.ng;
    # Everything over HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vote.nimcos.example.ng;

    root /var/www/nimcos/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/vote.nimcos.example.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vote.nimcos.example.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    client_max_body_size 25m;       # voter register uploads (app limit: 20 MB)
    client_body_timeout 30s;
    keepalive_timeout 30s;

    access_log /var/log/nginx/nimcos.access.log;
    error_log  /var/log/nginx/nimcos.error.log warn;

    # Static assets: long cache (URLs are versioned by modification time).
    location ~* ^/(assets|images)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Tighter limits on authentication endpoints (the app also rate-limits).
    location ~ ^/(access|verify|admin/login|admin/mfa)$ {
        limit_req zone=nimcos_auth burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        limit_req zone=nimcos_general burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Only the front controller may execute.
        location ~ ^/(?!index\.php) { return 404; }
        fastcgi_pass unix:/run/php/php8.3-fpm-nimcos.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Never serve dotfiles or anything outside /public.
    location ~ /\.(?!well-known) { deny all; }
}
